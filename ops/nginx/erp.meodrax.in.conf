server {
    listen 80;
    server_name erp.meodrax.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.meodrax.in;

    # Set your certificate paths here, or let certbot manage this server.
    # ssl_certificate /etc/letsencrypt/live/erp.meodrax.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.meodrax.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Optional compatibility host if the existing DNS record is erp.medorax.in.
# You can omit this server if that hostname is not used.
server {
    listen 80;
    server_name erp.medorax.in;
    return 301 https://erp.meodrax.in$request_uri;
}
