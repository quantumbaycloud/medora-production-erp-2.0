# Add these locations to the EXISTING api.medorax.in server block.
# Keep /licensing/ and the onboarding API locations intact.
#
# ERP API is intentionally mounted under /erp/ so api.medorax.in can remain
# the onboarding/admin control-plane host.

location ^~ /erp/ {
    proxy_pass http://127.0.0.1:8200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
