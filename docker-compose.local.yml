services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medorax_local_postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - medorax_local_redis_data:/data
    networks:
      - internal

  erp-api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./deploy/erp-api.local.env
    environment:
      LICENSE_ISSUER_URL: https://api.medorax.in/licensing
      LICENSE_ISSUER_TOKEN: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./local-secrets/licensing/public.pem:/run/secrets/medorax-license/public.pem:ro
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  erp-web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - erp-api
    networks:
      - internal

volumes:
  medorax_local_postgres_data:
  medorax_local_redis_data:

networks:
  internal:
