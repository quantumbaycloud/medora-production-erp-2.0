services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medorax}
      POSTGRES_USER: ${POSTGRES_USER:-medorax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medorax_local_dev_2026}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medorax_local_postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - medorax_local_redis_data:/data
    networks: [internal]

  licensing-issuer:
    build: ./licensing-issuer
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/licensing.db
      LICENSE_KEY_DIR: /run/secrets/medorax-license
      LICENSE_ISSUER_TOKEN: ${LOCAL_LICENSE_ISSUER_TOKEN:-local-only-issuer-token-change-me}
    ports:
      - "127.0.0.1:8101:8100"
    volumes:
      - medorax_local_licensing_data:/data
      - ./local-secrets/licensing:/run/secrets/medorax-license:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [internal]

  erp-api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./deploy/erp-api.local.env
    environment:
      LICENSE_ISSUER_URL: http://licensing-issuer:8100
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./local-secrets/licensing/public.pem:/run/secrets/medorax-license/public.pem:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      licensing-issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  erp-web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_ENABLE_ADMIN_SYNC: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      erp-api:
        condition: service_healthy
    networks: [internal]

volumes:
  medorax_local_postgres_data:
  medorax_local_redis_data:
  medorax_local_licensing_data:

networks:
  internal:
