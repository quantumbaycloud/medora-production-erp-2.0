services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]

  erp-api:
    build: ./backend
    restart: unless-stopped
    env_file: ./deploy/erp-api.env
    environment:
      LICENSE_ISSUER_URL: https://api.medorax.in/licensing
      LICENSE_ISSUER_TOKEN: ""
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./local-secrets/licensing/public.pem:/run/secrets/medorax-license/public.pem:ro
    networks: [internal]

  erp-web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://erp-api.medorax.in
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./ops/nginx:/etc/nginx/conf.d:ro
      - ./ops/tls:/etc/nginx/tls:ro
    depends_on:
      erp-api:
        condition: service_healthy
      erp-web:
        condition: service_started
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
networks:
  internal:
