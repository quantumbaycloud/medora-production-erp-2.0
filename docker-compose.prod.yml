services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]

  erp-api:
    build: ./backend
    restart: unless-stopped
    env_file: ./deploy/erp-api.env
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - ./keys/medorax-license/public.pem:/run/secrets/medorax-license/public.pem:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  erp-web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.medorax.in/erp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8273:80"
    depends_on:
      erp-api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
